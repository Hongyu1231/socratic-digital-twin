name: CI

on:
  pull_request:
    branches: [master]
  push:
    # Verify release candidates before promoting them to the production branch.
    branches: [master, 'feature/**']

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DEMO_SESSION_SECRET: ci-only-demo-session-secret
      FORCE_MEMORY_REPOSITORY: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-materials.txt
      - name: Install teaching-material importer dependencies
        run: python -m pip install -r scripts/requirements-materials.txt
      - name: Test the importer with synthetic documents only
        run: python scripts/test_import_teaching_materials.py
      - name: Test expert-interview ingestion with synthetic documents only
        run: python scripts/test_import_expert_interview.py
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check the Supabase Edge Function
        run: deno check supabase/functions/session-summary-worker/index.ts
      - name: Verify E2E target guard accepts an isolated test target
        env:
          E2E_BASE_URL: http://127.0.0.1:3000
          E2E_SUPABASE_URL: https://isolated-test-project.supabase.co
          E2E_DATA_ENVIRONMENT: test
          PRODUCTION_SUPABASE_URL: https://production-project.supabase.co
        run: npm run check:e2e-target
      - name: Verify E2E target guard rejects the production Vercel host
        env:
          E2E_BASE_URL: https://socratic-digital-twin-poc.vercel.app
          E2E_SUPABASE_URL: https://isolated-test-project.supabase.co
          E2E_DATA_ENVIRONMENT: test
          PRODUCTION_SUPABASE_URL: https://production-project.supabase.co
        shell: bash
        run: |
          if npm run check:e2e-target; then
            echo "::error::E2E target guard accepted the production Vercel host."
            exit 1
          fi
      - name: Verify E2E target guard rejects the production Supabase project
        env:
          E2E_BASE_URL: http://127.0.0.1:3000
          E2E_SUPABASE_URL: https://production-project.supabase.co
          E2E_DATA_ENVIRONMENT: test
          PRODUCTION_SUPABASE_URL: https://production-project.supabase.co
        shell: bash
        run: |
          if npm run check:e2e-target; then
            echo "::error::E2E target guard accepted the production Supabase project."
            exit 1
          fi

  database:
    name: database
    runs-on: ubuntu-latest
    # Docker image pulls and the first migration reset are substantially slower
    # than the application checks, especially on a cold GitHub-hosted runner.
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.114.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Confirm Supabase CLI version
        run: |
          test "$(supabase --version)" = "2.114.0"
      - name: Start the isolated local Supabase API stack
        # Keep Postgres, Kong, PostgREST, and GoTrue: the concurrency checks
        # use the local REST/RPC gateway and need the local service-role JWT
        # emitted by `supabase status`; the remaining optional services add
        # cold-start cost and are not needed by migrations or pgTAP.
        run: supabase start --exclude realtime,storage-api,imgproxy,mailpit,studio,edge-runtime,logflare,vector,supavisor,postgres-meta
      - name: Apply all migrations and the compatibility seed to the local database
        run: supabase db reset --local
      - name: Run database pgTAP tests
        run: supabase test db --local supabase/tests/database
      - name: Test concurrency target guard
        run: node --test scripts/test-db-concurrency-target.node.mjs
      - name: Run isolated multi-connection database checks
        env:
          SUPABASE_DATA_ENVIRONMENT: test
        shell: bash
        run: |
          set -euo pipefail
          eval "$(supabase status -o env)"
          export SUPABASE_URL="$API_URL"
          export SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY"
          node scripts/test-db-concurrency.mjs
      - name: Stop the isolated local database
        if: always()
        run: supabase stop --no-backup
